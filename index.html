<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Test</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="header">
    <h1 class="logo">Typing Test</h1>
    <button id="next-btn" class="text-btn" type="button">次のお題</button>
  </header>

  <main class="main">
    <p class="guide">
      ペーストを使わずに、下の文を最後まで打ってください。<br>
      計測は打ち始めた瞬間から始まります。Backspace で修正できます。
    </p>

    <div class="stats" aria-live="off">
      <div class="stat"><span id="stat-wpm" class="stat-value">0</span><span class="stat-label">WPM</span></div>
      <div class="stat"><span id="stat-acc" class="stat-value">100</span><span class="stat-label">% 正確率</span></div>
      <div class="stat"><span id="stat-time" class="stat-value">0.0</span><span class="stat-label">秒</span></div>
      <div class="stat"><span id="stat-miss" class="stat-value">0</span><span class="stat-label">ミス</span></div>
    </div>

    <div id="board" class="board">
      <div id="text" class="text"></div>
      <!-- 実際の入力はこの見えない textarea で受け取る（BS・スマホ・将来の日本語入力に対応しやすい） -->
      <textarea id="input" class="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="入力欄"></textarea>
      <div id="focus-hint" class="focus-hint">クリックして入力を再開</div>
    </div>

    <section id="result" class="result" hidden>
      <h2 class="result-title">結果</h2>
      <div class="result-grid">
        <div><span id="res-wpm" class="result-value"></span><span class="result-label">WPM</span></div>
        <div><span id="res-acc" class="result-value"></span><span class="result-label">% 正確率</span></div>
        <div><span id="res-time" class="result-value"></span><span class="result-label">秒</span></div>
        <div><span id="res-miss" class="result-value"></span><span class="result-label">ミス</span></div>
        <div><span id="res-iki" class="result-value"></span><span class="result-label">ms 平均 IKI</span></div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tab-rhythm" data-tab="rhythm" aria-controls="panel-rhythm" aria-selected="true">キーごとの間隔</button>
        <button type="button" class="tab" role="tab" id="tab-ngram" data-tab="ngram" aria-controls="panel-ngram" aria-selected="false">n-gram</button>
      </div>

      <div class="rhythm tab-panel" role="tabpanel" id="panel-rhythm" aria-labelledby="tab-rhythm">
        <p class="rhythm-legend">平均 <span id="rhythm-avg" class="rhythm-avg"></span> ms（点線）／ 速い<span class="rhythm-scale"></span>遅い ／ 赤い文字 = ミスあり</p>
        <div id="rhythm" class="rhythm-chart"></div>
      </div>

      <div class="ngram tab-panel" role="tabpanel" id="panel-ngram" aria-labelledby="tab-ngram" hidden>
        <p class="rhythm-legend">単語の中の連続する2文字（bigram）・3文字（trigram）ごとの平均 IKI。trigram は2つの打鍵間隔の平均 ／ ミスが絡んだものとスペースを含むものは除外 ／ 速い<span class="rhythm-scale"></span>遅い</p>
        <div class="ngram-grid">
          <div id="bigram" class="ngram-scroll"></div>
          <div id="trigram" class="ngram-scroll"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button id="retry-btn" class="retry-btn" type="button">もう一度 (esc)</button>
    <span id="version" class="version"></span>
  </footer>

  <script src="js/rhythm.js?v=9"></script>
  <script src="js/ngram.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
