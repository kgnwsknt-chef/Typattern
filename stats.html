<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Test 記録</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <header class="header">
    <h1 class="logo">Typing Test 記録</h1>
    <div class="header-actions">
      <a class="text-btn" href="index.html">タイピングに戻る</a>
    </div>
  </header>

  <main class="main stats-main">
    <section class="stats-section">
      <h2 class="stats-title">全記録の n-gram</h2>

      <div class="filters">
        <label class="filter">言語
          <select id="f-lang" class="layout-select">
            <option value="">すべて</option>
            <option value="en">英語</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <label class="filter">配列
          <select id="f-layout" class="layout-select">
            <option value="">すべて</option>
            <option value="qwerty">QWERTY</option>
          </select>
        </label>
        <label class="filter">モード
          <select id="f-mode" class="layout-select">
            <option value="">すべて</option>
            <option value="normal">通常</option>
            <option value="short">短いお題</option>
          </select>
        </label>
        <label class="filter">期間
          <select id="f-recent" class="layout-select">
            <option value="0">すべて</option>
            <option value="100">直近 100 回</option>
            <option value="30">直近 30 回</option>
            <option value="10">直近 10 回</option>
          </select>
        </label>
        <label class="filter">回数
          <select id="f-min" class="layout-select">
            <option value="1">1 回以上</option>
            <option value="3">3 回以上</option>
            <option value="5">5 回以上</option>
            <option value="10">10 回以上</option>
          </select>
        </label>
      </div>

      <p id="stats-summary" class="stats-summary">読み込み中…</p>
      <p class="rhythm-legend">単語の中の連続する2文字（bigram）・3文字（trigram）ごとの平均 IKI を、選んだ記録すべてで集計。trigram は2つの打鍵間隔の平均 ／ ミスが絡んだものとスペースを含むものは除外 ／ 色は全体の打鍵間隔の平均が基準 ／ 速い<span class="rhythm-scale"></span>遅い</p>
      <div class="ngram-grid">
        <div class="ngram-col">
          <div id="bigram" class="ngram-scroll"></div>
          <div id="bigram-dist" class="ngram-dist"></div>
        </div>
        <div class="ngram-col">
          <div id="trigram" class="ngram-scroll"></div>
          <div id="trigram-dist" class="ngram-dist"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer stats-footer">
    <span id="version" class="version"></span>
  </footer>

  <script src="js/store.js?v=16"></script>
  <script src="js/rhythm.js?v=16"></script>
  <script src="js/ngram.js?v=16"></script>
  <script src="js/stats.js?v=16"></script>
</body>
</html>
