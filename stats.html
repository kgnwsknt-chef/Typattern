<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typattern 記録</title>
  <link rel="stylesheet" href="style.css?v=39">
</head>
<body>
  <header class="header page-header">
    <div class="logo">Typattern<span id="version" class="version"></span></div>
    <h1 class="page-title">記録</h1>
  </header>

  <main class="main stats-main">
    <!-- レベルの達成度：全部の記録から出す（下のデータの絞り込みは効かない）。決まりは docs/levels.md -->
    <section class="stats-section level-section">
      <h2 class="stats-title">レベルの達成度</h2>
      <p class="rhythm-legend">言語・モードごとの達成レベル（正確率 95% 以上の回の一番よいレベル）と、次の目標。全部の記録から出し、下の絞り込みは効きません。短い文章は数えません。</p>
      <div id="levels" class="level-table-wrap"></div>
    </section>

    <h2 class="stats-title">データの絞り込み</h2>
    <div class="filters stats-filters">
      <label class="filter">言語
        <select id="f-lang" class="layout-select">
          <option value="">すべて</option>
          <option value="en">英語</option>
          <option value="ja">日本語</option>
        </select>
      </label>
      <label class="filter">配列
        <select id="f-layout" class="layout-select">
          <option value="">すべて</option>
          <option value="qwerty">QWERTY</option>
        </select>
      </label>
      <label class="filter">モード
        <select id="f-mode" class="layout-select">
          <option value="">すべて</option>
          <option value="normal">文章</option>
          <option value="short">短い文章</option>
          <option value="words">単語</option>
        </select>
      </label>
      <span class="filter">期間
        <input id="f-from" type="date" class="layout-select" aria-label="開始日">
        〜
        <input id="f-to" type="date" class="layout-select" aria-label="終了日">
        <button id="f-clear" type="button" class="text-btn small-btn" title="期間の指定をなくす">すべて</button>
      </span>
    </div>
    <p id="stats-summary" class="stats-summary">読み込み中…</p>

    <section class="stats-section">
      <h2 class="stats-title">推移</h2>
      <div class="filters">
        <label class="filter">まとめ方
          <select id="f-group" class="layout-select">
            <option value="run">1回ごと（横軸: 回数）</option>
            <option value="day">日ごと（横軸: 年月日）</option>
          </select>
        </label>
      </div>
      <p id="trend-legend" class="rhythm-legend"></p>
      <div id="trend" class="trend"></div>
    </section>

    <section class="stats-section">
      <h2 class="stats-title">ランキング</h2>
      <p id="ranking-legend" class="rhythm-legend"></p>
      <div id="ranking" class="ranking-scroll"></div>
    </section>

    <!-- ランキングの行をクリックしたとき：その回のキーごとの間隔（結果画面と同じグラフ） -->
    <section id="session-view" class="stats-section" hidden>
      <div class="dist-head">
        <h2 class="stats-title sv-title">その回のキーごとの間隔</h2>
        <button id="sv-close" type="button" class="dist-close" title="閉じる">×</button>
      </div>
      <p id="sv-summary" class="stats-summary"></p>
      <p id="sv-note" class="sv-note" hidden></p>
      <div class="rhythm">
        <p class="rhythm-legend"><span id="sv-what"></span>。その平均 <span id="sv-avg" class="rhythm-avg"></span> ms（点線。修正の時間を含まないので、結果の平均 IKI より小さくなる）／ 速い<span class="rhythm-scale"></span>遅い ／ 赤い文字 = ミスあり</p>
        <div id="sv-chart" class="rhythm-chart"></div>
      </div>
    </section>
  </main>

  <!-- 全ページ共通：左はページへのリンク、右は記録の操作 -->
  <footer class="footer page-footer">
    <nav class="footer-links" aria-label="ページ">
      <a class="text-btn" href="index.html">タイピング</a>
      <a class="text-btn" href="stats.html" aria-current="page" title="レベルの達成度・成績の推移・ランキング">記録</a>
      <a class="text-btn" href="ngram.html" title="bigram・trigram ごとの IKI">n-gram</a>
      <a class="text-btn" href="layouts.html" title="キー配列の確認と試し打ち">キー配列</a>
      <a class="text-btn" href="settings.html" title="グラフの範囲などの設定">設定</a>
    </nav>
    <div class="footer-actions">
      <span id="data-size" class="data-size" title="ブラウザに保存している記録と登録したキー配列の大きさ（書き出すファイルとほぼ同じ）"></span>
      <button id="export-btn" class="text-btn" type="button" title="全記録と登録したキー配列を JSON ファイルに保存">記録を書き出す</button>
      <button id="import-btn" class="text-btn" type="button" title="書き出した JSON ファイルから記録とキー配列を追加">記録を読み込む</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
  </footer>

  <script src="js/store.js?v=39"></script>
  <script src="js/settings.js?v=39"></script>
  <script src="js/page-footer.js?v=39"></script>
  <script src="js/rhythm.js?v=39"></script>
  <script src="js/keys.js?v=39"></script>
  <script src="js/romaji.js?v=39"></script>
  <script src="js/typer.js?v=39"></script>
  <script src="js/kana-layout.js?v=39"></script>
  <script src="js/ranking.js?v=39"></script>
  <script src="js/levels.js?v=39"></script>
  <script src="js/filters.js?v=39"></script>
  <script src="js/trend.js?v=39"></script>
  <script src="js/session-view.js?v=39"></script>
  <script src="js/stats.js?v=39"></script>
</body>
</html>
